<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Λιπάσματα">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%232f6b3a'/%3E%3Cpath d='M90 145V85M90 85C90 60 70 45 45 45c0 25 20 40 45 40zM90 105c0-22 18-36 42-36 0 22-18 36-42 36z' fill='none' stroke='%23dfeacb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='30' fill='%232f6b3a'/%3E%3Cpath d='M90 145V85M90 85C90 60 70 45 45 45c0 25 20 40 45 40zM90 105c0-22 18-36 42-36 0 22-18 36-42 36z' fill='none' stroke='%23dfeacb' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Υπολογιστής λιπασμάτων</title>
<style>
  :root {
    --soil: #2b2a24;
    --leaf: #2f6b3a;
    --leaf-dark: #1f4a29;
    --sprout: #dfeacb;
    --paper: #f7f8f2;
    --line: #cfd6bf;
    --muted: #6a6f5c;
    --warn: #b4551f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    background: var(--paper);
    color: var(--soil);
    line-height: 1.35;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  main { max-width: 560px; margin: 0 auto; padding: 12px 10px 40px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  h1 { font-size: 1.2rem; margin: 0; color: var(--leaf-dark); }
  .toggle { display: inline-flex; border: 1px solid var(--leaf); border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .toggle button {
    border: none; background: #fff; color: var(--leaf-dark);
    padding: 8px 11px; font-size: .85rem; font-family: inherit; cursor: pointer;
  }
  .toggle button.on { background: var(--leaf); color: #fff; }

  /* Αποτέλεσμα, κολλημένο πάνω ώστε να φαίνεται όσο συμπληρώνεις */
  .result {
    position: sticky; top: 0; z-index: 5;
    background: var(--paper);
    padding: 6px 0 8px;
    margin-bottom: 6px;
  }
  .result-card {
    background: var(--leaf);
    color: #fff;
    border-radius: 12px;
    padding: 10px 10px 12px;
    box-shadow: 0 2px 8px rgba(31,74,41,.25);
  }
  .result-title { font-size: .78rem; opacity: .85; margin-bottom: 6px; }
  .ratio-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
  .ratio-grid .l { font-size: .72rem; opacity: .85; }
  .ratio-grid .v { font-size: 1.05rem; font-weight: 700; margin-top: 1px; }
  .ratio-grid .kgv { font-size: .68rem; opacity: .8; margin-top: 2px; }
  .result-msg { font-size: .9rem; text-align: center; padding: 8px 4px; }
  .note { font-size: .72rem; color: var(--muted); margin: 6px 2px 0; }

  /* Κάρτες λιπασμάτων */
  .fert {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .fert.active { border-color: var(--leaf); box-shadow: 0 0 0 1px var(--leaf); }
  .top { display: flex; gap: 8px; align-items: center; }
  .top .nm { flex: 1; min-width: 0; }
  .top .kg { width: 96px; flex-shrink: 0; }
  .comp { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 8px; }
  .comp label { display: block; text-align: center; font-size: .7rem; color: var(--muted); }
  .comp input { margin-top: 2px; }

  input[type=number], input[type=text] {
    width: 100%;
    padding: 10px 4px;
    font-size: 16px; /* αποτρέπει το zoom στο iPhone */
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--soil);
    font-family: inherit;
    text-align: center;
  }
  input[type=text] { text-align: left; padding-left: 8px; font-weight: 600; }
  .kg input {
    border: 2px solid var(--leaf);
    background: #f2f8ec;
    font-weight: 700;
    font-size: 18px;
  }
  .comp input { color: var(--muted); }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--leaf); outline-offset: 1px; }

  .actions { margin-top: 12px; display: flex; gap: 8px; }
  .actions button {
    flex: 1; padding: 12px 8px; font-size: .95rem; font-family: inherit;
    border-radius: 10px; border: 1px solid var(--leaf); cursor: pointer;
    background: #fff; color: var(--leaf-dark);
  }
  .actions button:active { background: var(--sprout); }

  @media (max-width: 360px) {
    .ratio-grid .v { font-size: .95rem; }
    .top .kg { width: 84px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Λιπάσματα</h1>
    <div class="toggle" role="group" aria-label="Μορφή σχέσης">
      <button id="btnOxide" class="on" type="button">Οξείδια</button>
      <button id="btnElem" type="button">Στοιχεία</button>
    </div>
  </header>

  <div class="result">
    <div class="result-card" id="resultCard"></div>
  </div>

  <div id="list"></div>

  <div class="actions">
    <button id="btnClear" type="button">Μηδενισμός κιλών</button>
    <button id="btnAdd" type="button">+ Νέο λίπασμα</button>
  </div>
  <p class="note" id="note"></p>
</main>

<script>
const STORE = "lipasmata-v1";

/* Ca και Mg σε μορφή οξειδίου (CaO, MgO) όπως στην ετικέτα */
const DEFAULTS = [
  { name: "Νιτρικό κάλιο",    n: 13, p: 0,  k: 46, ca: 0,  mg: 0,  kg: "" },
  { name: "Φωσφορικό κάλιο",  n: 0,  p: 52, k: 34, ca: 0,  mg: 0,  kg: "" },
  { name: "Θειικό κάλιο",     n: 0,  p: 0,  k: 50, ca: 0,  mg: 0,  kg: "" },
  { name: "Θειικό μαγνήσιο",  n: 0,  p: 0,  k: 0,  ca: 0,  mg: 16, kg: "" },
  { name: "Νιτρικό ασβέστιο", n: 15, p: 0,  k: 0,  ca: 26, mg: 0,  kg: "" },
  { name: "Νιτρικό μαγνήσιο", n: 11, p: 0,  k: 0,  ca: 0,  mg: 16, kg: "" },
  { name: "", n: "", p: "", k: "", ca: "", mg: "", kg: "" },
  { name: "", n: "", p: "", k: "", ca: "", mg: "", kg: "" }
];

const P_PER_P2O5 = 0.4364, K_PER_K2O = 0.8301, CA_PER_CAO = 0.7147, MG_PER_MGO = 0.6030;

let data, mode = "oxide";

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE));
    if (s && Array.isArray(s.data) && s.data.length) { data = s.data; mode = s.mode || "oxide"; return; }
  } catch (e) {}
  data = JSON.parse(JSON.stringify(DEFAULTS));
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify({ data, mode })); } catch (e) {}
}

const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isNaN(x) ? 0 : x; };
const fmt = (x, d = 2) => isFinite(x)
  ? x.toLocaleString("el-GR", { minimumFractionDigits: 0, maximumFractionDigits: d }) : "–";

function build() {
  const list = document.getElementById("list");
  list.innerHTML = data.map((f, i) => `
    <div class="fert ${num(f.kg) > 0 ? "active" : ""}" data-i="${i}">
      <div class="top">
        <input class="nm" type="text" data-k="name" value="${String(f.name).replace(/"/g, "&quot;")}" placeholder="Νέο λίπασμα" aria-label="Όνομα λιπάσματος">
        <div class="kg"><input type="number" inputmode="decimal" step="any" min="0" data-k="kg" value="${f.kg}" placeholder="kg" aria-label="Κιλά"></div>
      </div>
      <div class="comp">
        ${["n","p","k","ca","mg"].map((k, j) => `
          <label>${["N","P₂O₅","K₂O","Ca","Mg"][j]}
            <input type="number" inputmode="decimal" step="any" min="0" data-k="${k}" value="${f[k]}" aria-label="${["N","P₂O₅","K₂O","Ca","Mg"][j]} %">
          </label>`).join("")}
      </div>
    </div>`).join("");
}

function calculate() {
  const tot = { n: 0, p: 0, k: 0, ca: 0, mg: 0 };
  data.forEach(f => {
    const kg = num(f.kg);
    if (kg <= 0) return;
    tot.n  += kg * num(f.n)  / 100;
    tot.p  += kg * num(f.p)  / 100;
    tot.k  += kg * num(f.k)  / 100;
    tot.ca += kg * num(f.ca) / 100;
    tot.mg += kg * num(f.mg) / 100;
  });
  const elem = { n: tot.n, p: tot.p * P_PER_P2O5, k: tot.k * K_PER_K2O, ca: tot.ca * CA_PER_CAO, mg: tot.mg * MG_PER_MGO };
  const use = mode === "oxide" ? tot : elem;
  const lbls = mode === "oxide" ? ["N","P₂O₅","K₂O","CaO","MgO"] : ["N","P","K","Ca","Mg"];
  const keys = ["n","p","k","ca","mg"];
  const card = document.getElementById("resultCard");

  if (use.n <= 0) {
    const any = keys.some(k => use[k] > 0);
    card.innerHTML = `<div class="result-msg">${any
      ? "Δεν υπάρχει άζωτο στο μείγμα, η σχέση προς 1 άζωτο δεν ορίζεται."
      : "Βάλε κιλά σε ένα ή περισσότερα λιπάσματα."}</div>`;
  } else {
    card.innerHTML =
      `<div class="result-title">Σχέση προς 1 άζωτο</div>` +
      `<div class="ratio-grid">` +
      keys.map((k, i) =>
        `<div><div class="l">${lbls[i]}</div><div class="v">${fmt(use[k] / use.n)}</div><div class="kgv">${fmt(use[k])} kg</div></div>`
      ).join("") + `</div>`;
  }
  document.getElementById("note").textContent = mode === "oxide"
    ? "Οξείδια όπως στην ετικέτα (P₂O₅, K₂O, CaO, MgO). Κάτω από κάθε τιμή: kg θρεπτικού."
    : "Στοιχειακή μορφή: P = P₂O₅×0,4364 · K = K₂O×0,8301 · Ca = CaO×0,7147 · Mg = MgO×0,6030.";
}

function setMode(m) {
  mode = m;
  document.getElementById("btnOxide").classList.toggle("on", m === "oxide");
  document.getElementById("btnElem").classList.toggle("on", m === "elem");
  save(); calculate();
}

document.getElementById("list").addEventListener("input", e => {
  const card = e.target.closest(".fert");
  if (!card) return;
  const f = data[+card.dataset.i];
  f[e.target.dataset.k] = e.target.value;
  card.classList.toggle("active", num(f.kg) > 0);
  save(); calculate();
});
document.getElementById("btnOxide").addEventListener("click", () => setMode("oxide"));
document.getElementById("btnElem").addEventListener("click", () => setMode("elem"));
document.getElementById("btnClear").addEventListener("click", () => {
  data.forEach(f => f.kg = "");
  build(); save(); calculate();
});
document.getElementById("btnAdd").addEventListener("click", () => {
  data.push({ name: "", n: "", p: "", k: "", ca: "", mg: "", kg: "" });
  build(); save(); calculate();
  const inputs = document.querySelectorAll('.fert [data-k="name"]');
  inputs[inputs.length - 1].focus();
});

load();
build();
setMode(mode);
</script>
</body>
</html>
